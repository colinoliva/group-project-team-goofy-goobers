name: CI and Release

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"

      - name: Install CI dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Compile Python sources
        run: python -m compileall -q src/implementation src/prototype/software

      - name: Run tests
        run: python -m pytest -q

      - name: Build and verify release bundle
        shell: bash
        run: |
          archive="$(bash scripts/package_release.sh "ci-${GITHUB_SHA}" "${RUNNER_TEMP}/release-check")"
          unzip -tq "$archive"
          python - "$archive" <<'PY'
          import json
          import sys
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as bundle:
              names = bundle.namelist()
              sensor_files = [name for name in names if name.endswith("/src/implementation/sensors.json")]
              assert len(sensor_files) == 1, sensor_files
              sensors = json.loads(bundle.read(sensor_files[0]))
              assert all("?" in sensor[port] for sensor in sensors["sensors"] for port in ("cli", "data"))
              assert any(name.endswith("/README.md") for name in names)
              assert any(name.endswith("/requirements.txt") for name in names)
              assert any(name.endswith("/src/implementation/mapping.cfg") for name in names)
          print("Release bundle contents verified")
          PY

  release:
    name: Package GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Build release bundle
        shell: bash
        run: |
          archive="$(bash scripts/package_release.sh "${GITHUB_REF_NAME}" "${RUNNER_TEMP}/release")"
          echo "Release asset: ${archive}"

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "${RUNNER_TEMP}/release/ti-mmwave-radar-${GITHUB_REF_NAME}.zip" --title "${GITHUB_REF_NAME}" --generate-notes
